<!-- assets/img/typography-degradation-and-naive-fix.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748b; }
      .font-card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 700; }
      .font-card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #334155; }
      .font-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; }
      .font-edge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-rose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#e11d48" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Header Banner -->
  <rect x="24" y="20" width="912" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="42" class="font-title">大模型在多媒介排版中的退化路径与次生治理陷阱</text>
  <text x="44" y="60" class="font-sub">还原 LLM 面对空间拥挤时的“阻力最小逃逸本能”及人工盲目 Auto-Fix 导致的几何级联穿透</text>
  
  <rect x="792" y="32" width="128" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="856" y="50" text-anchor="middle" class="font-badge" fill="#475569">空间代偿失真模型</text>

  <!-- Step 1: Input Prompt -->
  <g transform="translate(300, 92)">
    <rect width="360" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="180" y="24" text-anchor="middle" class="font-card-title" fill="#0f172a">用户提示词 (Prompt)</text>
    <text x="180" y="40" text-anchor="middle" class="font-card-text" fill="#64748b">"构建高密度数据流转拓扑图 / 复杂大屏看板"</text>
  </g>

  <!-- Arrow down to LLM -->
  <path d="M 480 140 L 480 162" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- Step 2: LLM Generation & Dilemma -->
  <g transform="translate(280, 164)">
    <rect width="400" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="200" y="26" text-anchor="middle" class="font-card-title" fill="#1e40af">空间拥挤冲突 (Bounding Box Conflict)</text>
    <text x="200" y="44" text-anchor="middle" class="font-card-text" fill="#2563eb">字符总宽度计算值 &gt; 容器卡片可用宽度 / 轴段间距不足</text>
  </g>

  <!-- Diverging paths -->
  <!-- Left path to Instinct Escape -->
  <path d="M 380 220 L 380 248 L 240 248 L 240 270" stroke="#e11d48" stroke-width="1.8" fill="none" marker-end="url(#arrow-rose)"/>
  <rect x="140" y="238" width="200" height="22" rx="4" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1"/>
  <text x="240" y="253" text-anchor="middle" class="font-edge" fill="#be123c">传统本能路径：阻力最小逃逸</text>

  <!-- Right path to Secondary Trap -->
  <path d="M 580 220 L 580 248 L 720 248 L 720 270" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="620" y="238" width="200" height="22" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="720" y="253" text-anchor="middle" class="font-edge" fill="#b45309">次生治理陷阱：盲目 Auto-Fix</text>

  <!-- Left Branch: MiniFont Escape -->
  <g transform="translate(48, 274)">
    <rect width="384" height="216" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4" filter="url(#card-shadow)"/>
    <path d="M 48 282 A 8 8 0 0 1 56 274 L 424 274 A 8 8 0 0 1 432 282 L 432 312 L 48 312 Z" fill="#fff1f2" transform="translate(-48, -274)"/>
    <line x1="0" y1="38" x2="384" y2="38" stroke="#fca5a5" stroke-width="1"/>
    <text x="16" y="25" class="font-card-title" fill="#991b1b">字号降级代偿 (font-size: 9px / 10px)</text>
    <rect x="296" y="10" width="76" height="20" rx="10" fill="#fee2e2"/>
    <text x="334" y="24" text-anchor="middle" class="font-badge" fill="#b91c1c">生理底线坍塌</text>

    <!-- Sub items -->
    <rect x="16" y="52" width="352" height="68" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="28" y="74" class="font-card-title" fill="#b91c1c">1. 视觉模糊与浏览器扭曲</text>
    <text x="28" y="94" class="font-card-text">
      <tspan x="28">投影视件及移动端下笔画粘连彻底不可读；</tspan>
      <tspan x="28" dy="1.35em">Chrome 等引擎强制干预缩放导致排版不可控错位。</tspan>
    </text>

    <rect x="16" y="132" width="352" height="68" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="28" y="154" class="font-card-title" fill="#b91c1c">2. 散落未受控的魔法数字</text>
    <text x="28" y="174" class="font-card-text">
      <tspan x="28">ECharts/D3/Canvas 深度配置中裸写 fontSize: 9，</tspan>
      <tspan x="28" dy="1.35em">打破全局 UI 主题规范，加剧代码腐化与不可维护性。</tspan>
    </text>
  </g>

  <!-- Right Branch: Naive Auto-Fix -->
  <g transform="translate(528, 274)">
    <rect width="384" height="216" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4" filter="url(#card-shadow)"/>
    <path d="M 528 282 A 8 8 0 0 1 536 274 L 904 274 A 8 8 0 0 1 912 282 L 912 312 L 528 312 Z" fill="#fffbeb" transform="translate(-528, -274)"/>
    <line x1="0" y1="38" x2="384" y2="38" stroke="#fcd34d" stroke-width="1"/>
    <text x="16" y="25" class="font-card-title" fill="#92400e">静态正则粗暴替换 (9px -&gt; 12px)</text>
    <rect x="296" y="10" width="76" height="20" rx="10" fill="#fef3c7"/>
    <text x="334" y="24" text-anchor="middle" class="font-badge" fill="#b45309">几何拓扑撕裂</text>

    <!-- Sub items -->
    <rect x="16" y="52" width="352" height="68" rx="6" fill="#fffdf5" stroke="#fef08a" stroke-width="1"/>
    <text x="28" y="74" class="font-card-title" fill="#b45309">1. 物理字宽瞬时暴增 +33.3%</text>
    <text x="28" y="94" class="font-card-text">
      <tspan x="28">仅放大字号未重构坐标系，单行文字直接穿透</tspan>
      <tspan x="28" dy="1.35em">固定宽度的矩形卡片，造成严重的几何穿模与截断。</tspan>
    </text>

    <rect x="16" y="132" width="352" height="68" rx="6" fill="#fffdf5" stroke="#fef08a" stroke-width="1"/>
    <text x="28" y="154" class="font-card-title" fill="#b45309">2. 级联锚点与连线交叠崩溃</text>
    <text x="28" y="174" class="font-card-text">
      <tspan x="28">下游连接线、端口锚点与相邻卡片大面积重叠；</tspan>
      <tspan x="28" dy="1.35em">证明字阶治理绝非静态文本替换，必须重算包围盒。</tspan>
    </text>
  </g>
</svg>
