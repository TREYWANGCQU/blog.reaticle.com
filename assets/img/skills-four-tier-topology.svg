  <rect x="237" y="216" width="180" height="40" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#shadow)"/>
  <text x="245" y="232" class="card-title" fill="#1e40af">typst-archiver</text>
  <text x="245" y="246" class="card-desc">双阶段清洗差异比对 SOP</text>

  <rect x="237" y="262" width="180" height="40" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1" filter="url(#shadow)"/>
  <text x="245" y="278" class="card-title" fill="#1e40af">typst</text>
  <text x="245" y="292" class="card-desc">本地模板与语义排版规范</text>

