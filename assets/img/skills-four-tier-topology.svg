  <rect x="29" y="124" width="180" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#shadow)"/>
  <text x="37" y="140" class="card-title" fill="#065f46">ai-lyrics-aligner</text>
  <text x="37" y="154" class="card-desc">音频对齐与逐字时间戳生成</text>

  <rect x="29" y="170" width="180" height="40" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#shadow)"/>
  <text x="37" y="186" class="card-title" fill="#065f46">audio-metadata-manager</text>
