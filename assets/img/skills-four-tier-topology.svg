  <text x="453" y="292" class="card-desc">分层核验与双轮熔断防御</text>

  <rect x="445" y="308" width="180" height="40" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow)"/>
  <text x="453" y="324" class="card-title" fill="#5b21b6">reviewer</text>
  <text x="453" y="338" class="card-desc">质量门禁与工程规范审查</text>

  <rect x="445" y="354" width="180" height="40" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1" filter="url(#shadow)"/>
  <text x="453" y="370" class="card-title" fill="#5b21b6">researcher</text>
  <text x="453" y="384" class="card-desc">证据分级与权威事实核验</text>

  <!-- ==================== COLUMN 4: TIER 4 ==================== -->
  <rect x="644" y="72" width="198" height="340" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
  <path d="M 644 80 A 8 8 0 0 1 652 72 L 834 72 A 8 8 0 0 1 842 80 L 842 116 L 644 116 Z" fill="#fff7ed"/>
  <line x1="644" y1="116" x2="842" y2="116" stroke="#fed7aa" stroke-width="1"/>
