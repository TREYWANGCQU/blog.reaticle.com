  <text x="661" y="200" class="card-desc">深度随想、留白与心智探讨</text>

  <rect x="653" y="216" width="180" height="40" rx="5" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
  <text x="661" y="232" class="card-title" fill="#9a3412">english-reflective-writer</text>
  <text x="661" y="246" class="card-desc">英文随笔、散文与智性探索</text>

  <rect x="653" y="262" width="180" height="40" rx="5" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
  <text x="661" y="278" class="card-title" fill="#9a3412">industry-report-writer</text>
  <text x="661" y="292" class="card-desc">基础设施与数字化战略研报</text>

  <rect x="653" y="308" width="180" height="40" rx="5" fill="#ffffff" stroke="#fdba74" stroke-width="1" filter="url(#shadow)"/>
  <text x="661" y="324" class="card-title" fill="#9a3412">research-paper-writer</text>
  <text x="661" y="338" class="card-desc">工程论文规范与结构化写作</text>

  <!-- Tier 4 Callout -->
  <rect x="653" y="354" width="180" height="40" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="661" y="370" class="note-title" fill="#c2410c">✦ 认知留白与心智推理</text>
  <text x="661" y="384" class="note-desc" fill="#9a3412">拒绝机械化脚本，保留思维柔性与深度</text>

  <!-- ==================== BOTTOM SPECTRUM AXIS ==================== -->
  <rect x="20" y="422" width="820" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="440" class="axis-text" fill="#047857">◀ 强计算确定性 · 二进制/AST/多媒体处理 · 必须挂载 scripts/</text>
  <text x="430" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b">─── 认知抽象层级递增 · 脚本侵入性递减 ───</text>
  <text x="828" y="440" text-anchor="end" class="axis-text" fill="#c2410c">强认知开放性 · 逻辑推演与思维范式 · 严禁配置 scripts/ ▶</text>
