<!-- assets/img/skills-four-tier-topology.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 465" width="100%" height="100%">
  <defs>
    <style>
      .hdr-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .hdr-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #64748b; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11.5px; font-weight: 700; }
      .col-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 9px; font-weight: 600; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 10.5px; font-weight: 600; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 9px; fill: #64748b; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 9.5px; font-weight: 700; }
      .note-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 9.5px; font-weight: 600; }
      .note-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 8.5px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="465" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Header Banner -->
  <rect x="20" y="16" width="820" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="34" class="hdr-title">基于计算确定性与认知抽象度的四层技能拓扑 (21 项技能资产全景)</text>
  <text x="36" y="49" class="hdr-sub">严格界定计算宿主（scripts/）必要性边界：底层算法强隔离，顶层元认知与思维范式免受脚本侵入</text>

  <!-- Stats Pill -->
  <rect x="710" y="27" width="116" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="768" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#334155">4 Tiers · 21 Skills</text>

  <!-- ==================== COLUMN 1: TIER 1 ==================== -->
  <rect x="20" y="72" width="198" height="340" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <path d="M 20 80 A 8 8 0 0 1 28 72 L 210 72 A 8 8 0 0 1 218 80 L 218 116 L 20 116 Z" fill="#ecfdf5"/>
  <line x1="20" y1="116" x2="218" y2="116" stroke="#a7f3d0" stroke-width="1"/>
  <text x="30" y="91" class="col-title" fill="#065f46">Tier 1: 确定性引擎技能</text>
  <rect x="30" y="98" width="102" height="15" rx="3" fill="#d1fae5"/>
  <text x="34" y="109" class="col-badge" fill="#047857">严格配置 scripts/</text>
  <text x="195" y="108" text-anchor="end" font-size="9" font-weight="700" fill="#059669">6 项</text>

