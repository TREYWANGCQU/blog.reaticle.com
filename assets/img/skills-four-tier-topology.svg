  <text x="247" y="362" class="note-desc" fill="#64748b">• 承担质量闸门（Gatekeeper）</text>
  <text x="247" y="377" class="note-desc" fill="#64748b">• 仅持薄包装脚本或纯 SOP 契约</text>

  <!-- ==================== COLUMN 3: TIER 3 ==================== -->
  <rect x="436" y="72" width="198" height="340" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <path d="M 436 80 A 8 8 0 0 1 444 72 L 626 72 A 8 8 0 0 1 634 80 L 634 116 L 436 116 Z" fill="#f5f3ff"/>
