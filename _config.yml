title: Y.WANG
description: Engineering, systems and the friction of reality.工程、系统与现实摩擦面的观察与实践。Memoirs about me, the music and the night. Memoirs about think-ism and practice-ism.
show_downloads: false
google_analytics:
url: "https://blog.reaticle.com"
baseurl: ""
author: Y.WANG
email: y.wang@reaticle.com
iconfont_url: https://at.alicdn.com/t/font_2714580_eqcgguazg7q.css
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
include:
  - _pages
  - tag
  - .nojekyll #防止 GitHub Pages 二次处理
keep_files:
  - assets
  - tag
  - CNAME
  - .nojekyll
exclude:
  - scripts/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - "*.gem"
  - "*.gemspec"
  - LICENSE
  - README.md
  - all-text.txt # 字体子集化临时文件
  - assets/fonts/fontSource/ # 源字体文件目录
  - "*.pyc"
  - __pycache__/
  # 不要排除 assets!
markdown: kramdown
highlighter: rouge

paginate: 7
paginate_path: "/blog/page:num/"
